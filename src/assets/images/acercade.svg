<rect x="590" y="190" width="150" height="150" rx="24" fill="url(#ac)"/>
<path d="M638 252 v-20 a27 27 0 0 1 54 0 v20" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
<rect x="625" y="250" width="80" height="58" rx="10" fill="#fff"/>
<circle cx="665" cy="272" r="8" fill="#1A0D3B"/><rect x="661" y="276" width="8" height="16" rx="3" fill="#1A0D3B"/>
<text x="665" y="330" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">JWT</text>
</g>

<!-- chips de stack -->
<g font-size="15" font-weight="700" text-anchor="middle">
<rect x="60" y="470" width="130" height="40" rx="20" fill="#A064FF" fill-opacity=".2" stroke="#A064FF"/><text x="125" y="496" fill="#C9A8FF">Spring Boot</text>
<rect x="204" y="470" width="80" height="40" rx="20" fill="#FF6B6B" fill-opacity=".18" stroke="#FF6B6B"/><text x="244" y="496" fill="#FF9B9B">Java</text>
<rect x="60" y="522" width="110" height="40" rx="20" fill="#FF6B6B" fill-opacity=".18" stroke="#FF6B6B"/><text x="115" y="548" fill="#FF9B9B">Docker</text>
<rect x="184" y="522" width="130" height="40" rx="20" fill="#A064FF" fill-opacity=".2" stroke="#A064FF"/><text x="249" y="548" fill="#C9A8FF">PostgreSQL</text>
</g>

<!-- conectores -->
<path d="M560 265 H590" stroke="#A064FF" stroke-width="2" stroke-dasharray="6 6"/>
<text x="60" y="60" fill="#A064FF" font-size="14" font-weight="700" letter-spacing="3">BACKEND DEVELOPER</text>
</svg>
