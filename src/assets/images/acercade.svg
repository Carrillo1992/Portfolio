<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 800 640" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A0D3B"/><stop offset="1" stop-color="#2D1460"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A064FF"/><stop offset="1" stop-color="#FF6B6B"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#A064FF" stroke-opacity=".08"/></pattern>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dy="14" result="b"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="640" fill="url(#bg)"/><rect width="800" height="640" fill="url(#grid)"/>
<circle cx="640" cy="120" r="200" fill="#A064FF" opacity=".10"/>
<circle cx="120" cy="560" r="200" fill="#FF6B6B" opacity=".07"/>

<!-- terminal (detrás) -->
<g filter="url(#sh)">
<rect x="380" y="380" width="360" height="190" rx="14" fill="#0D0624" stroke="#A064FF" stroke-opacity=".4"/>
<circle cx="404" cy="404" r="6" fill="#FF6B6B"/><circle cx="424" cy="404" r="6" fill="#FFC76B"/><circle cx="444" cy="404" r="6" fill="#7CE3A8"/>
<g font-family="JetBrains Mono,Consolas,monospace" font-size="15">
<text x="404" y="446" fill="#E0E0E0"><tspan fill="#FF6B6B">$</tspan> docker compose up -d</text>
<text x="404" y="476" fill="#7CE3A8">✔ <tspan fill="#B0B0B0">Container postgres</tspan>  Started</text>
<text x="404" y="502" fill="#7CE3A8">✔ <tspan fill="#B0B0B0">Container api</tspan>       Started</text>
<text x="404" y="532" fill="#E0E0E0"><tspan fill="#FF6B6B">$</tspan> <tspan fill="#A064FF">▍</tspan></text>
</g></g>

<!-- editor -->
<g filter="url(#sh)">
<rect x="60" y="90" width="500" height="340" rx="16" fill="#120830" stroke="#A064FF" stroke-opacity=".6" stroke-width="2"/>
<path d="M60 106 a16 16 0 0 1 16 -16 h468 a16 16 0 0 1 16 16 v22 h-500z" fill="#1F0F47"/>
<circle cx="86" cy="110" r="6" fill="#FF6B6B"/><circle cx="106" cy="110" r="6" fill="#FFC76B"/><circle cx="126" cy="110" r="6" fill="#7CE3A8"/>
<rect x="150" y="98" width="170" height="30" rx="6" fill="#120830"/><text x="164" y="118" fill="#E0E0E0" font-size="13">TaskController.java</text>
<g font-family="JetBrains Mono,Consolas,monospace" font-size="15">
<g fill="#5B4A86" text-anchor="end"><text x="98" y="166">1</text><text x="98" y="192">2</text><text x="98" y="218">3</text><text x="98" y="244">4</text><text x="98" y="270">5</text><text x="98" y="296">6</text><text x="98" y="322">7</text><text x="98" y="348">8</text><text x="98" y="374">9</text><text x="98" y="400">10</text></g>
<text x="116" y="166" fill="#FFC76B">@RestController</text>
<text x="116" y="192"><tspan fill="#FFC76B">@RequestMapping</tspan><tspan fill="#E0E0E0">(</tspan><tspan fill="#7CE3A8">"/api/v1/tasks"</tspan><tspan fill="#E0E0E0">)</tspan></text>
<text x="116" y="218"><tspan fill="#FF6B6B">public class</tspan><tspan fill="#E0E0E0"> TaskController {</tspan></text>
<text x="140" y="270" fill="#FFC76B">@PreAuthorize<tspan fill="#E0E0E0">(</tspan><tspan fill="#7CE3A8">"hasRole('USER')"</tspan><tspan fill="#E0E0E0">)</tspan></text>
<text x="140" y="296" fill="#FFC76B">@GetMapping</text>
<text x="140" y="322"><tspan fill="#FF6B6B">public</tspan><tspan fill="#E0E0E0"> List&lt;TaskDTO&gt; </tspan><tspan fill="#A064FF">findAll</tspan><tspan fill="#E0E0E0">() {</tspan></text>
<text x="164" y="348"><tspan fill="#FF6B6B">return</tspan><tspan fill="#E0E0E0"> service.</tspan><tspan fill="#A064FF">findAll</tspan><tspan fill="#E0E0E0">();</tspan></text>
<text x="140" y="374" fill="#E0E0E0">}</text>
<text x="116" y="400" fill="#E0E0E0">}</text>
</g>
<rect x="100" y="254" width="3" height="128" fill="url(#ac)"/>
</g>

<!-- insignia JWT -->
