<section class="experience-section">
  <h3>Experiencia</h3>

  <div class="timeline">
    @for (job of jobs; track job.company){
      <article class="job">
        <div class="job-header">
          <div>
            <h4>{{ job.role }}</h4>
            <span class="company">{{ job.company }}</span>
          </div>
          <span class="period">{{ job.period }}</span>
        </div>
        @if (job.note){
          <p class="note"><mat-icon>trending_up</mat-icon> {{ job.note }}</p>
        }
        <ul>
          @for (item of job.highlights; track $index){
            <li>{{ item }}</li>
          }
        </ul>
        <div class="tech-tags">
          @for (tech of job.technologies; track tech){
            <span class="tech-tag">{{ tech }}</span>
          }
        </div>
      </article>
    }
  </div>
</section>
